name: Build RPD APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Kodu al
        uses: actions/checkout@v5

      - name: Java 17 kur
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

       
    

      - name: SDK paketlerini kur
            
            run: yes |               run: 'yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-35" "build-tools;35.0.0"'  



      - name: Gradle kur
        uses : gradle /actions/setup-gradle@v4
        ile :
          gradle-sürümü : '8.10.2'

      - isim : APK 
        Çalıştır : gradle assembleDebug --no-daemon

      - name : APK 'yi yükle
        uses : actions/upload-artifact@v4
        ile :
          adı : RPD-debug-apk
          yol : app/build/outputs/apk/debug/app-debug.apk
